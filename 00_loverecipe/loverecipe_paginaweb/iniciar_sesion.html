    <title>Iniciar Sesión</title>

            <form class="formulario" id="formulario">

                <input class="input-item" type="text" name="user" id="nombreUsuario" placeholder="Usuario">

                <input class="btn-input1" type="button" value="Iniciar sesion" onclick="hacerLogin()">

        </div>
    </div>
